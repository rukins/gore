services:
  gore:
    restart: always
    image: gore:latest
    environment:
      GORE_CONF: ./data/goreconf.yml
    volumes:
      - ../data:/app/data
    # Login credentials for auth.latere.ai. Optional so a deployment using basic auth needs no .env file. See .env.template.
    env_file:
      - path: ../.env
        required: false
    deploy:
      replicas: 1
    networks:
      - traefik_proxy
networks:
  traefik_proxy:
    external: true
